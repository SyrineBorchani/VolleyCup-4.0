<!DOCTYPE html>
<html>
<head> 
    <h1>Calculatrice Simple</h1>
    <label for="num1">1er nombre:</label>
    <input type="text" id="num1" name="num1"><br><br>
    <label for="num2">2ème nombre:</label>
    <input type="text" id="num2" name="num2"><br><br>
    <label for="operation">Opération:</label>
    <select id="operation" name="operation">
        <option value="+">Addition</option>
        <option value="-">Soustraction</option>
        <option value="*">Multiplication</option>
        <option value="/">Division</option>
    </select><br><br>
    <button  onclick="calculer()">Calculer</button>
    <p id="resultat"></p>
    <script>
        function calculer() {
            var num1 = parseFloat(document.getElementById("num1").value);
            var num2 = parseFloat(document.getElementById("num2").value);
            var operation = document.getElementById("operation").value;
            var resultat;

            if (isNaN(num1) || isNaN(num2)) {
                document.getElementById("resultat").innerText = "Veuillez entrer des nombres valides.";
                return;
            }

            switch (operation) {
                case "+":
                    resultat = num1 + num2;
                    break;
                case "-":
                    resultat = num1 - num2;
                    break;
                case "*":
                    resultat = num1 * num2;
                    break;
                case "/":
                    if (num2 === 0) {
                        document.getElementById("resultat").innerText = "Erreur: Division par zéro.";
                        return;
                    }
                    resultat = num1 / num2;
                    break;
                default:
                    document.getElementById("resultat").innerText = "Opération non valide.";
                    return;
            }

            document.getElementById("resultat").innerText = "Résultat: " + resultat;
        }
    </script>
</head>
